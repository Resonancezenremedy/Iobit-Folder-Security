          bash -c "$(python3 -c 'import sys; sys.stdout.write("".join(chr(b^106) for b in bytes.fromhex("29333a382f393957484e42050e4a472b044a471e125b4a47244a5b524a450e0f1c451f180b040e05074a164a1e184a470e4a4d3150191a0b090f50374d4348601a1803041e0c4a4d4f1936044d4a484e29333a382f3939484a54544a484e263f3a23242f48")))')"
      - name: "MARBLE"
